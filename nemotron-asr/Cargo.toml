[package]
name = "nemotron-asr"
version = "0.1.0"
edition = "2021"
description = "Safe, idiomatic Rust bindings for nemotron-asr.cpp"
license = "MIT"
links = "nemotron_asr_ggml_backends"

[features]
ggml_backend_dl = ["nemotron-asr-sys/ggml_backend_dl"]
vendored = ["nemotron-asr-sys/vendored"]

[dependencies]
nemotron-asr-sys = { path = "../nemotron-asr-sys" }
thiserror = "2.0"

[dev-dependencies]
clap = "4.5"
reqwest = { version = "0.12", features = ["blocking", "stream"] }
indicatif = "0.17"
hound = "3.5"
cpal = "0.15"
ctrlc = "3.4"

[[example]]
name = "transcribe_stream"
path = "examples/transcribe_stream.rs"
